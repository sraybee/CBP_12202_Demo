apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: cbp-12202-combined-workflow
on:
  workflow_dispatch:
jobs:
  build:
    outputs:
      artifact-name: ${{ steps.build-artifact.outputs.name }}
      version: ${{ steps.generate-version.outputs.version }}
    steps:
      - name: Generate Version
        id: generate-version
        uses: docker://alpine:3.21
        shell: sh
        run: |
          VERSION="1.0.0-cbp-12202"
          printf "%s" "$VERSION" > "$CLOUDBEES_OUTPUTS/version"

      - name: Build Artifact
        id: build-artifact
        uses: docker://alpine:3.21
        shell: sh
        run: |
          ARTIFACT_NAME="cbp-12202-artifact-${{ steps.generate-version.outputs.version }}"
          printf "%s" "$ARTIFACT_NAME" > "$CLOUDBEES_OUTPUTS/name"

  integration-test:
    needs: [build]
    steps:
      - name: Setup
        uses: docker://alpine:3.20
        shell: sh
        run: |
          echo "Preparing integration environment..."

      - name: Run Integration Tests
        uses: docker://alpine:3.20
        shell: sh
        run: |
          echo "Running integration tests against ${{ needs.build.outputs.artifact-name }}"

      - name: Cleanup Test Environment
        uses: ./actions/cleanup-test
        if: always()

  deploy-staging:
    needs: [build, integration-test]
    steps:
      - name: Create Namespace
        id: namespace
        uses: docker://alpine:3.21
        shell: sh
        run: |
          NAMESPACE="staging-cbp-12202"
          printf "%s" "$NAMESPACE" > "$CLOUDBEES_OUTPUTS/name"

      - name: Deploy to Staging
        uses: ./actions/deploy-app
        with:
          environment: staging
          namespace: ${{ steps.namespace.outputs.name }}
          version: ${{ needs.build.outputs.version }}
          artifact: ${{ needs.build.outputs.artifact-name }}
          replicas: "1"
          log-level: debug

      - name: Cleanup Staging
        uses: ./actions/cleanup-staging
        if: always()
        with:
          namespace: ${{ steps.namespace.outputs.name }}

  deploy-production:
    needs: [build]
    steps:
      - name: Deploy to Production
        uses: ./actions/deploy-app
        with:
          environment: production
          namespace: production
          version: ${{ needs.build.outputs.version }}
          artifact: ${{ needs.build.outputs.artifact-name }}
          replicas: "3"
          log-level: info

  cbp-12202-smoke:
    needs: [deploy-production]
    steps:
      - name: Sanity Check
        uses: docker://alpine:3.21
        shell: sh
        run: |
          echo "Running smoke checks for production deployment..."
